[project]
name = "sweet-spots-reproducibility"
version = "1.0.1"
description = "Reproducible analyses for the O-GlcNAc regional sequence code"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Filip Rumenovski"},
    {name = "Charlie Fehl"},
]
maintainers = [
    {name = "Filip Rumenovski"},
]
requires-python = ">=3.12,<3.13"
keywords = ["O-GlcNAc", "glycosylation", "computational biology", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython==1.85",
    "duckdb==1.5.2",
    "kinase-library==1.7.1",
    "matplotlib==3.8.4",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "pillow==11.3.0",
    "polars==1.39.0",
    "pyarrow==23.0.1",
    "pypdf==6.0.0",
    "pyyaml==6.0.2",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "snakemake==9.17.1",
    "snakemake-executor-plugin-slurm==2.0.3",
    "statsmodels==0.14.6",
    "xlsxwriter==3.2.9",
]

[project.urls]
Repository = "https://github.com/filiprumenovski/sweet-spots"
Documentation = "https://github.com/filiprumenovski/sweet-spots#readme"
Data = "https://github.com/filiprumenovski/sweet-spots/releases/tag/inputs-v1"
Issues = "https://github.com/filiprumenovski/sweet-spots/issues"

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regional_code_paper"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# kinase-library 1.7.1 declares an unnecessarily narrow SciPy upper bound even
# though the scoring path used here is compatible with the archived SciPy 1.17
# environment.  Preserve the actually validated runtime rather than silently
# downgrading the numerical stack.
[tool.uv]
override-dependencies = [
    "biopython==1.85",
    "matplotlib==3.8.4",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "pyarrow==23.0.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
]
